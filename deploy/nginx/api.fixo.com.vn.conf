# ==============================================================================
# Nginx Configuration for api.fixo.com.vn (Laravel REST API & Laravel Reverb)
# VPS IP: 103.48.84.51
# ==============================================================================

# Upstream cho Laravel Reverb WebSocket Server (Port 8080)
upstream reverb_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

# Upstream cho Laravel API Server (nếu chạy php artisan serve hoặc Octane port 8000)
upstream laravel_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80) -> Redirect 301 sang HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.fixo.com.vn;

    # Hỗ trợ xác thực Let's Encrypt Certbot Webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Tự động chuyển hướng toàn bộ traffic sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (Port 443) -> SSL + Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.fixo.com.vn;

    # SSL Certificate do Let's Encrypt cấp qua Certbot
    ssl_certificate /etc/letsencrypt/live/api.fixo.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fixo.com.vn/privkey.pem;

    # Tiêu chuẩn bảo mật SSL/TLS hiện đại (A+ Grade)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Giới hạn dung lượng upload file (hình ảnh tiếp nhận, linh kiện sửa chữa)
    client_max_body_size 50M;

    # Log files
    access_log /var/log/nginx/api.fixo.com.vn.access.log;
    error_log /var/log/nginx/api.fixo.com.vn.error.log;

    # --------------------------------------------------------------------------
    # Định tuyến WebSocket: Laravel Reverb (/app/*)
    # Khách hàng kết nối: wss://api.fixo.com.vn/app/podscare_reverb_key?...
    # --------------------------------------------------------------------------
    location /app {
        proxy_pass http://reverb_backend;
        proxy_http_version 1.1;

        # Upgrade Headers thiết yếu cho WebSocket Handshake
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Forwarding client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # WebSocket Timeout (giữ kết nối sống 10 phút, Reverb tự heartbeat 30s)
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Tắt buffer để dữ liệu event truyền realtime không độ trễ
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Định tuyến Reverb HTTP API (/apps/*)
    # Dùng khi Laravel Backend gửi broadcast event nội bộ tới Reverb Server
    # --------------------------------------------------------------------------
    location /apps {
        proxy_pass http://reverb_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --------------------------------------------------------------------------
    # Định tuyến Laravel REST API
    # --------------------------------------------------------------------------
    # PHƯƠNG ÁN 1: Nếu chạy Reverse Proxy sang Laravel Serve / Octane (Port 8000)
    location / {
        proxy_pass http://laravel_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # PHƯƠNG ÁN 2 (Khuyên dùng khi triển khai PHP-FPM trực tiếp trên VPS):
    # Nếu muốn dùng PHP-FPM thay vì Port 8000, mở comment khối dưới và đóng khối trên:
    #
    # root /var/www/bed-podscare/apps/api/public;
    # index index.php index.html;
    #
    # location / {
    #     try_files $uri $uri/ /index.php?$query_string;
    # }
    #
    # location ~ \.php$ {
    #     include fastcgi_params;
    #     fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # hoặc php8.3-fpm.sock
    #     fastcgi_index index.php;
    #     fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    #     fastcgi_param DOCUMENT_ROOT $realpath_root;
    #     fastcgi_param HTTP_X_FORWARDED_PROTO https;
    #     fastcgi_param HTTPS on;
    # }
}
