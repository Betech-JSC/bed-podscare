# ==============================================================================
# Supervisor Process Configuration for Laravel Reverb & Queue Worker
# Place in: /etc/supervisor/conf.d/reverb.conf
# ==============================================================================

# Tiến trình Laravel Reverb WebSocket Server
[program:reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/bed-podscare/apps/api/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/reverb.log
stopwaitsecs=3600

# Tiến trình Laravel Queue Worker (xử lý background jobs & queued events)
[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/bed-podscare/apps/api/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/worker.log
stopwaitsecs=3600
